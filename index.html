function newChat(){closeD();const u=users[me.u];if(!u.msgs.length)return;if(busy)return toast('انتظر انتهاء الرد');const c={id:Date.now(),t:'محادثة جديدة',m:[],ts:Date.now()};u.chats.push(c);useChat(c.id)}
$('#bNew').onclick=newChat;$('#bPlus').onclick=newChat;
$('#cl2').onclick=e=>{const u=users[me.u],T=e.target,rn=T.closest('[data-rn]'),dc=T.closest('[data-dc]'),it=T.closest('.ci');
 if(rn){const c=u.chats.find(x=>x.id==rn.dataset.rn),n=prompt('اسم المحادثة:',c.t);if(n&&n.trim()){c.t=n.trim().slice(0,40);save();drawList()}return}
 if(dc){if(busy)return toast('انتظر انتهاء الرد');if(!confirm('حذف هذه المحادثة؟'))return;const id=+dc.dataset.dc;u.chats=u.chats.filter(x=>x.id!==id);hyd(u);save();renderMsgs();drawList();return}
 if(it){if(busy)return toast('انتظر انتهاء الرد');useChat(+it.dataset.id);closeD()}};
function pf(){const p=prefs(),A={v:['#8b5cf6','#06b6d4'],b:['#3b82f6','#22d3ee'],g:['#10b981','#a3e635'],p:['#ec4899','#f59e0b']}[p.ac||'v'];const r=document.documentElement.style;r.setProperty('--p',A[0]);r.setProperty('--p2',A[1])}

/* الإعدادات */
function ovl(title,body,wide){const o=$('#ovl');o.innerHTML=`<div class="ov"><div class="pn"><div class="hd"><span>${title}</span><button class="ib" id="cl" style="width:32px;height:32px">${ic('x')}</button></div>${body}</div></div>`;$('#cl').onclick=()=>o.innerHTML='';return o}
$('#bSet').onclick=()=>{
 const p=prefs();
 ovl(ic('sliders')+' الإعدادات',`<div class="bd">
 <div class="sw"><span>قراءة الردود بصوت عالي تلقائيًا</span><input type="checkbox" id="s1" ${p.speak?'checked':''}></div>
 <div class="sw"><span>إرسال تلقائي بعد انتهاء الكلام</span><input type="checkbox" id="s2" ${p.auto?'checked':''}></div>
 <div style="padding:12px 0"><label>لغة الإملاء الصوتي</label><select id="s6"><option value="ar-EG">عربي - مصر</option><option value="ar-SA">عربي - السعودية</option><option value="ar-AE">عربي - الخليج</option><option value="en-US">English</option></select>
 <label>لون الموقع</label><select id="s7"><option value="v">بنفسجي</option><option value="b">أزرق</option><option value="g">أخضر</option><option value="p">وردي</option></select>
 <label>حجم الخط: <span id="sv">${p.size}</span></label><input type="range" id="s3" min="12" max="22" value="${p.size}" style="padding:0"></div>
 <button class="btn g" id="s8" style="margin-bottom:8px">${ic('key')} تغيير كلمة المرور</button>
 <button class="btn g" id="s5" style="margin-bottom:8px">${ic('download')} تحميل كل محادثاتي</button>
 <button class="btn g" id="s4" style="margin-bottom:8px">${ic('trash')} مسح هذه المحادثة</button>
 <button class="btn r" id="s9">${ic('trash')} حذف كل المحادثات</button></div>`);
 $('#s6').value=p.lang||'ar-EG';$('#s7').value=p.ac||'v';
 const sv=()=>{S.s('vpr_pf_'+me.u,{speak:$('#s1').checked,auto:$('#s2').checked,size:+$('#s3').value,lang:$('#s6').value,ac:$('#s7').value});$('#sv').textContent=$('#s3').value;$('#msgs').style.fontSize=$('#s3').value+'px';pf()};
 ['#s1','#s2','#s3','#s6','#s7'].forEach(x=>$(x).oninput=sv);
 $('#s4').onclick=()=>{if(busy)return toast('انتظر انتهاء الرد');if(confirm('مسح رسائل هذه المحادثة؟')){users[me.u].msgs.length=0;save();renderMsgs();$('#ovl').innerHTML=''}};
 $('#s9').onclick=()=>{if(busy)return toast('انتظر انتهاء الرد');if(confirm('حذف كل المحادثات نهائيًا؟')){const u=users[me.u];u.chats=[];hyd(u);save();renderMsgs();$('#ovl').innerHTML=''}};
 $('#s5').onclick=()=>dl('chats-'+me.u+'.txt',users[me.u].chats.map(c=>'## '+c.t+'\n'+c.m.map(m=>(m.r==='user'?'أنا: ':'AI: ')+m.t).join('\n\n')).join('\n\n----------\n\n'));
 $('#s8').onclick=()=>{if(me.admin)return toast('غير متاح للمدير');const o=prompt('كلمة المرور الحالية:');if(o===null)return;if(hash(o)!==users[me.u].p)return toast('كلمة المرور غير صحيحة');const n=prompt('كلمة المرور الجديدة (4 أحرف على الأقل):');if(n&&n.length>=4){users[me.u].p=hash(n);save();toast('تم تغيير كلمة المرور')}else toast('كلمة غير صالحة')};
};
function dl(n,t,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click()}

/* لوحة الأدمن */
$('#bAdm').onclick=()=>adm('dash');
function adm(tab){
 const names=Object.keys(users).filter(k=>k!=='admin'),tot=names.reduce((a,k)=>a+(users[k].chats||[]).reduce((b,c)=>b+c.m.length,0),0),used=names.reduce((a,k)=>a+users[k].used,0);
 const T=[['dash',ic('chart')+' الإحصائيات'],['usr',ic('users')+' المستخدمين'],['api',ic('key')+' الذكاء الاصطناعي'],['site',ic('layout')+' إعدادات الموقع'],['bk',ic('db')+' النسخ الاحتياطي']];
 let b='';
 if(tab==='dash')b=`<div class="grid"><div class="st"><b>${names.length}</b><span>مستخدم</span></div><div class="st"><b>${used}</b><span>رسائل مستخدمة</span></div><div class="st"><b>${tot}</b><span>رسائل محفوظة</span></div><div class="st"><b>${names.filter(k=>users[k].ban).length}</b><span>محظور</span></div></div><p style="color:var(--m)">حالة الـ API: ${cfg.key?'<span class="tag">متصل</span>':'<span class="tag x">غير مربوط</span>'}</p>`;
 if(tab==='usr')b=`<table><tr><th>المستخدم</th><th>المستخدم/الحد</th><th>إجراءات</th></tr>${names.map(k=>{const x=users[k];return`<tr><td>${h(k)} ${x.ban?'<span class="tag x">محظور</span>':''}</td><td>${x.used}/${x.limit}</td><td><button class="btn sm g" data-a="rs" data-k="${h(k)}">تصفير</button><button class="btn sm g" data-a="lm" data-k="${h(k)}">الحد</button><button class="btn sm g" data-a="bn" data-k="${h(k)}">${x.ban?'فك':'حظر'}</button><button class="btn sm g" data-a="vw" data-k="${h(k)}">محادثة</button><button class="btn sm r" data-a="dl" data-k="${h(k)}">حذف</button></td></tr>`}).join('')||'<tr><td colspan=3>لا يوجد مستخدمين بعد</td></tr>'}</table>`;
 if(tab==='api')b=`<label>المزود (يملأ الرابط والموديل تلقائيًا)</label><select id="pv"><option value="">اختر...</option><option value="https://api.openai.com/v1/chat/completions|gpt-4o-mini">OpenAI</option><option value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions|gemini-2.0-flash">Google Gemini</option><option value="https://openrouter.ai/api/v1/chat/completions|openai/gpt-4o-mini">OpenRouter</option><option value="https://api.groq.com/openai/v1/chat/completions|llama-3.3-70b-versatile">Groq</option><option value="https://api.deepseek.com/chat/completions|deepseek-chat">DeepSeek</option></select><label>رابط الـ API (متوافق مع OpenAI)</label><input id="a1" value="${h(cfg.url)}" dir="ltr"><label>مفتاح API</label><input id="a2" type="password" value="${h(cfg.key)}" dir="ltr" placeholder="sk-..."><label>الموديل</label><input id="a3" value="${h(cfg.model)}" dir="ltr"><label>تعليمات النظام (شخصية البوت)</label><textarea id="a4" rows="4">${h(cfg.sys)}</textarea><button class="btn" id="asv">حفظ وتفعيل</button><button class="btn g" id="atst" style="margin-top:8px">اختبار الاتصال</button><p style="color:var(--m);font-size:.8rem;margin-top:10px">بعد الحفظ، الموقع يرد تلقائيًا على كل المستخدمين.</p>`;
 if(tab==='site')b=`<label>اسم الموقع</label><input id="w1" value="${h(cfg.name)}"><label>عدد الرسائل الافتراضي للمستخدم الجديد</label><input id="w2" type="number" value="${cfg.limit}"><label>إعلان يظهر أعلى الموقع (اتركه فارغ للإخفاء)</label><input id="w3" value="${h(cfg.notice)}"><div class="sw"><span>السماح بالتسجيل الجديد</span><input type="checkbox" id="w4" ${cfg.open?'checked':''}></div><button class="btn" id="wsv" style="margin-top:12px">حفظ</button><button class="btn g" id="wall" style="margin-top:8px">تطبيق الحد الجديد على كل المستخدمين</button>`;
 if(tab==='bk')b=`<button class="btn" id="e1">${ic('download')} تصدير كل البيانات</button><label style="margin-top:14px">استيراد نسخة</label><input type="file" id="e2" accept=".json"><button class="btn r" id="e3" style="margin-top:8px">حذف كل بيانات الموقع</button>`;
 ovl(ic('shield')+' لوحة التحكم',`<div class="at">${T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</div><div class="bd">${b}</div>`);
 document.querySelectorAll('.at button').forEach(x=>x.onclick=()=>adm(x.dataset.t));
 document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{const k=x.dataset.k,a=x.dataset.a,u=users[k];
  if(a==='rs'){u.used=0;toast('تم التصفير')}
  if(a==='lm'){const n=prompt('الحد الجديد:',u.limit);if(n!==null&&!isNaN(n))u.limit=+n}
  if(a==='bn')u.ban=!u.ban;
  if(a==='dl'&&confirm('حذف '+k+'؟'))delete users[k];
  if(a==='vw'){alert((u.chats||[]).map(c=>'## '+c.t+'\n'+c.m.slice(-12).map(m=>(m.r==='user'?'أنا: ':'AI: ')+m.t).join('\n')).join('\n\n')||'لا توجد رسائل');return}
  save();adm('usr')});
 if(tab==='api'){
  $('#a2').oninput=e=>{const k=e.target.value.trim(),M=[['sk-or-','https://openrouter.ai/api/v1/chat/completions','openai/gpt-4o-mini','OpenRouter'],['AIza','https://generativelanguage.googleapis.com/v1beta/openai/chat/completions','gemini-2.0-flash','Gemini'],['gsk_','https://api.groq.com/openai/v1/chat/completions','llama-3.3-70b-versatile','Groq'],['sk-','https://api.openai.com/v1/chat/completions','gpt-4o-mini','OpenAI']];if(k.startsWith('sk-ant'))return toast('مفاتيح Anthropic المباشرة غير متوافقة — استخدم OpenRouter');const m=M.find(x=>k.startsWith(x[0]));if(m){$('#a1').value=m[1];$('#a3').value=m[2];toast('تم التعرف على المزود: '+m[3])}};
  $('#pv').onchange=e=>{const[v,m]=e.target.value.split('|');if(v){$('#a1').value=v;$('#a3').value=m}};
  const rd=()=>{cfg.url=$('#a1').value.trim();cfg.key=$('#a2').value.trim();cfg.model=$('#a3').value.trim();cfg.sys=$('#a4').value};
  $('#asv').onclick=()=>{rd();save();toast('تم الحفظ — الموقع الآن يرد تلقائيًا')};
  $('#atst').onclick=async()=>{rd();toast('جاري الاختبار...');try{const r=await fetch(cfg.url,{method:'POST',headers:hdr(),body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:'قل مرحبا'}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);toast('يعمل: '+(j.choices[0].message.content||'').slice(0,40))}catch(e){toast('فشل: '+e.message)}};
 }
 if(tab==='site'){
  $('#wsv').onclick=()=>{cfg.name=$('#w1').value||DEF.name;cfg.limit=+$('#w2').value||50;cfg.notice=$('#w3').value;cfg.open=$('#w4').checked;save();boot();toast('تم الحفظ')};
  $('#wall').onclick=()=>{cfg.limit=+$('#w2').value||50;Object.keys(users).forEach(k=>k!=='admin'&&(users[k].limit=cfg.limit));save();quota();toast('تم التطبيق')};
 }
 if(tab==='bk'){
  $('#e1').onclick=()=>dl('chatvpr-backup.json',JSON.stringify({cfg,users}),'application/json');
  $('#e2').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);cfg={...DEF,...d.cfg};users=d.users||{};save();toast('تم الاستيراد');boot()}catch(x){toast('ملف غير صالح')}};r.readAsText(e.target.files[0])};
  $('#e3').onclick=()=>{if(confirm('حذف كل شيء؟')){localStorage.clear();location.reload()}};
 }
}

if(me&&(me.admin||users[me.u]&&!users[me.u].ban))boot();
</script>
</body>
  </html>
